name: 이터널리턴 패치노트 자동 업데이트

on:
  schedule:
    - cron: '0 0 * * 3'   # 매주 수요일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      force:
        description: '새 패치 없어도 강제 실행'
        type: boolean
        default: false
      pages:
        description: '크롤링 페이지 수'
        type: number
        default: 1

jobs:
  update-patchnote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 파이프라인 실행
        run: |
          ARGS="--pages ${{ inputs.pages || 1 }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python pipeline.py $ARGS

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add patchnote_changes.csv patchnote_TC.xlsx data/last_patch.json
          if git diff --staged --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "chore: 패치노트 자동 업데이트 $(date +'%Y-%m-%d')"
            git push
          fi
